Edite o docker-compose.yml original do projeto: no serviço 'app', remova a linha 'ports: - "${APP_PORT:-3000}:3000"' (não expõe mais direto ao host), adicione 'container_name: acougue-pdv-cliente1', e inclua a rede externa: em 'networks' da raiz do arquivo adicione 'proxynet: {external: true}', e no serviço 'app' liste 'networks: [default, proxynet]'. O serviço 'postgres' continua só na rede 'default' (não precisa acesso externo). Teste: revise o YAML com um validador online (ex: yamllint.com) colando o conteúdo — indentação errada é o erro mais comum aqui.
5
