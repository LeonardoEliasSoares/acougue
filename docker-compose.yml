Failed to deploy a stack: compose up operation failed: Error response from daemon: failed to create task for container: failed to create shim task: OCI runtime create failed: runc create failed: unable to start container process: error during container init: error mounting "/data/compose/13/Caddyfile" to rootfs at "/etc/caddy/Caddyfile": mount /data/compose/13/Caddyfile:/etc/caddy/Caddyfile (via /proc/self/fd/6), flags: 0x5000: not a directory: unknown: Are you trying to mount a directory onto a file (or vice-versa)? Check if the specified host path exists and is the expected type

Pensou por 11s
Esse erro é porque o arquivo Caddyfile não existe de fato na pasta da stack — o Docker, ao tentar montar um arquivo que não existe no host, cria uma pasta vazia no lugar (comportamento padrão de bind mount), e depois trava porque o container espera um arquivo ali, não uma pasta. Isso acontece porque colar só o docker-compose.yml no editor web do Portainer não cria os outros arquivos referenciados nos volumes — só o compose em si.

A correção:

1
Remover a stack com erro
Vá em Stacks → proxy → Remove (ou, se ainda não tiver conseguido rodar nada, só delete a stack com erro). Não precisa mexer em containers/redes, só remover essa stack específica pra recriar do jeito certo. Teste: a stack 'proxy' não deve mais aparecer na lista de Stacks.
2
Recriar a stack usando 'Add an additional file' para o Caddyfile
Stacks → Add stack → nome 'proxy' → método 'Web editor' → cole o conteúdo do proxy-compose.yml. Logo abaixo do editor de compose, o Portainer tem um botão '+ Add an additional file' (ou 'Add file') — clique nele, dê o nome exato 'Caddyfile' e cole o conteúdo (pode usar o do Caddyfile-clientes que te enviei, ou começar só com uma linha de comentário). Isso faz o Portainer criar o arquivo de verdade na pasta da stack, não só o docker-compose.yml. Deploy the stack. Teste: em Containers, 'saas-proxy' deve subir sem erro de mount; nos Logs dele não deve aparecer erro de sintaxe do Caddyfile.
Se essa opção não aparecer na sua versão do Portainer (algumas versões mais antigas do CE não têm), a alternativa é usar o método Git também pra essa stack: coloca o proxy-compose.yml (renomeado pra docker-compose.yml) e o Caddyfile no mesmo repositório/pasta, e aponta o Portainer pra esse repo — assim os dois arquivos chegam juntos na pasta da stack no host.

