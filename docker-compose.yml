Stacks → Add stack → nome 'acougue-cliente1' → método Repository, aponte pro Git do passo 1 e o arquivo docker-compose.yml ajustado. Em Environment variables, defina: POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD (senha forte, única desse cliente) e APP_PORT (pode deixar 3000, já que não vai ser exposto). Clique em Deploy the stack. Teste: acompanhe o build no log do deploy até aparecer sucesso; depois em Containers confirme 'acougue-postgres' e 'acougue-pdv-cliente1' como 'running', e nos Logs do container postgres deve aparecer 'database system is ready to accept connections'.
