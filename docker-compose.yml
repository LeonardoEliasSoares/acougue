Entendi — sua versão do Portainer não tem o recurso de arquivos extras nesse editor. Nesse caso, o caminho mais confiável é usar o método Git também para essa stack, igual você já vai fazer para o app do cliente. Assim o Caddyfile vira um arquivo real no disco (clonado junto com o repositório), em vez de depender do bind mount de algo que nunca existiu no host.

1
Colocar Caddyfile e compose juntos no repositório
No mesmo repositório Git que você já criou (ou um novo, só pra infra), crie uma pasta 'proxy/' contendo dois arquivos: o proxy-compose.yml que te enviei (renomeado para 'docker-compose.yml') e o 'Caddyfile' (pode usar o conteúdo do Caddyfile-clientes). Teste: acessando o repositório pelo navegador, confirme que os dois arquivos aparecem dentro de 'proxy/'.
2
Recriar a stack via Repositório (Git)
Se a stack 'proxy' com erro ainda existir, remova-a (Stacks → proxy → Remove). Depois: Stacks → Add stack → nome 'proxy' → método 'Repository' → informe a URL do repositório, a branch, e em 'Compose path' coloque 'proxy/docker-compose.yml' (o caminho relativo dentro do repo). Deploy the stack. Teste: em Containers, 'saas-proxy' deve subir sem erro de mount; nos Logs, sem erro de sintaxe do Caddyfile.
3
Como atualizar o Caddyfile depois (fluxo contínuo)
Quando precisar editar o Caddyfile no futuro (adicionar um cliente novo, por exemplo), faça a alteração no arquivo do repositório e dê commit/push. No Portainer, abra a stack 'proxy' e clique em 'Pull and redeploy' (ou 'Update the stack' com a opção de re-puxar do Git) — isso atualiza o arquivo no host e reinicia o container com a configuração nova. Teste: depois de atualizar, confirme no Console do container ('cat /etc/caddy/Caddyfile') que o conteúdo bate com o que você colocou no repositório.
Um detalhe importante: quando o Compose usa caminho relativo no volumes: (./Caddyfile:/etc/caddy/Caddyfile), esse ./ é relativo à pasta onde o docker-compose.yml está — como agora ele está dentro de proxy/, o ./Caddyfile vai procurar corretamente em proxy/Caddyfile no clone do repositório. Não precisa mudar nada no volumes: do arquivo que já te enviei.

