O Portainer, pra usar 'build:' num docker-compose (que é o caso do seu Dockerfile), funciona melhor apontando pra um repositório Git em vez de colar o código manualmente. Crie um repo (pode ser privado) no GitHub/GitLab/Gitea e suba a pasta extraída do zip (package.json, Dockerfile, server/, public/, database/, docker-compose.yml). Teste: confirme que o repo tem esses arquivos na raiz acessando pelo navegador — se o Dockerfile não estiver na raiz do repo, o build vai falhar depois.
