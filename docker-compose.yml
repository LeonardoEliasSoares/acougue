Alguns pontos de atenção que valem reforçar:

Passo 1 é obrigatório porque o Portainer via Git é o método mais confiável para builds com Dockerfile (como o README-PORTAINER.md do próprio projeto já avisa). Se você tentar colar o compose direto no editor web sem repositório, o Portainer não vai achar o Dockerfile.
Guarde a senha do PostgreSQL que você definir no passo 5 em algum lugar seguro (gerenciador de senhas) — ela não deve ficar só no Portainer.
